name: Deploy to Hugging Face

# Every merge to main re-publishes the app to the Hugging Face Space.
# Needs, in GitHub → Settings → Secrets and variables → Actions:
#   secret   HF_TOKEN  — a Hugging Face access token with "write" permission
#   variable HF_SPACE  — the Space name, e.g. Nitingupta0/tutor
# Until both exist this workflow does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN or HF_SPACE not configured yet — skipping deploy."
            exit 0
          fi

          # Spaces reject plain binary files, and the app doesn't need the screenshots or history.
          rm -rf .git docs

          # A Space's README needs this header to know how to run the app.
          {
            echo "---"
            echo "title: Tutor"
            echo "emoji: 🧭"
            echo "colorFrom: indigo"
            echo "colorTo: purple"
            echo "sdk: docker"
            echo "app_port: 7860"
            echo "pinned: false"
            echo "short_description: A DSA tutor that answers, hints and debugs"
            echo "---"
            echo
            echo "Source code: https://github.com/${GITHUB_REPOSITORY}"
          } > README.md

          git init -q -b main
          git config user.name "Nitin Gupta"
          git config user.email "ngupta3_be23@thapar.edu"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
