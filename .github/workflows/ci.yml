name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The tests stub out the embedding model, databases and LLM, so the multi-GB
      # sentence-transformers / torch install is skipped to keep CI fast.
      - name: Install dependencies
        run: |
          grep -v '^sentence-transformers' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
