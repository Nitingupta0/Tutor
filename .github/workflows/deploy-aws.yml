name: Deploy to server

# Optional: after every merge to main, log in to the server and run scripts/update.sh.
# Needs, in GitHub → Settings → Secrets and variables → Actions → Secrets:
#   EC2_HOST     the server's address (Elastic IP or domain)
#   EC2_SSH_KEY  the full contents of the .pem key file
# Until both exist this workflow does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: check
        env:
          HOST: ${{ secrets.EC2_HOST }}
          KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "EC2_HOST or EC2_SSH_KEY not configured — skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the server
        if: steps.check.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.EC2_HOST }}
          KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 600 /dev/null key.pem
          printf '%s\n' "$KEY" > key.pem
          ssh -i key.pem -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "ubuntu@${HOST}" 'cd ~/Tutor && bash scripts/update.sh'
          rm -f key.pem
